
name: Build EmergencyBandage

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract source ZIP
        run: |
          ZIP_FILE=$(find . -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "找不到源码 ZIP"
            exit 1
          fi
          mkdir -p workspace
          unzip -q "$ZIP_FILE" -d workspace

      - name: Build mod
        run: |
          BUILD_FILE=$(find workspace -name build.gradle -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "找不到 build.gradle"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EmergencyBandage-Forge-1.20.1
          path: workspace/**/build/libs/*.jar
          if-no-files-found: error
